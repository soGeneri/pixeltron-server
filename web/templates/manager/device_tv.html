{{ define "device_tv" }}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ .Device.Name }} - TV Mode</title>
        <link rel="icon" href="/static/favicon.ico" sizes="32x32">
        <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
        <link rel="stylesheet" href="/static/css/fonts.css">
        <link rel="stylesheet" href="/static/css/tokens.css">
        <link rel="stylesheet" href="/static/css/fontawesome.min.css">
        <link rel="stylesheet" href="/static/css/solid.min.css">
        <script>
        // Wait for the HTML to be fully loaded
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('fullscreen-btn');

            if (btn) {
                btn.addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(err => {
                            console.error(`Error: ${err.message}`);
                        });
                        btn.innerHTML = '<i class="fa-solid fa-compress"></i> Exit';
                    } else {
                        document.exitFullscreen();
                        btn.innerHTML = '<i class="fa-solid fa-expand"></i> Fullscreen';
                    }
                });
            }

            // Keep the interval here as well
            setInterval(() => {
                const images = document.querySelectorAll('.app-card img');
                images.forEach(img => {
                    const url = new URL(img.src);
                    url.searchParams.set('t', Date.now());
                    img.src = url.toString();
                });
            }, 60000);
        });
        </script>
        <style>
        body, html {
            /* TV mode is an always-dark stage in both themes. */
            background-color: var(--stage) !important;
            color: var(--cream);
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Changed to auto so you can scroll if apps overflow,
            but we hide the scrollbar visuals below */
            overflow-y: auto;
            font-family: var(--font-sans);
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        body::-webkit-scrollbar {
            display: none;
        }

        .tv-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Changed to min-height to allow page to grow */
            padding: 30px;
            box-sizing: border-box;
        }

        .device-header {
            font: 800 2.5rem/1.1 var(--font-sans);
            letter-spacing: -0.02em;
            margin-top: 30px;        /* Changed from margin-bottom to margin-top */
            border-top: var(--border-pixel) solid var(--on-stage-muted); /* Changed from border-bottom to border-top */
            padding-top: 15px;       /* Changed from padding-bottom to padding-top */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-grid {
            display: grid;
            /* Changed to auto-fit and increased min-width to 350px
            so apps look better on large screens */
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            flex-grow: 1;
            align-content: center;
        }

        .app-card img {
            width: 100%;
            height: auto;
            object-fit: contain;
            image-rendering: pixelated;
            /* Ensures pixels stay sharp regardless of scaling */
        }

        .app-card img {
            background: var(--screen);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            vertical-align: middle;
            font: 500 13px/16px var(--font-mono);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--cream);
            padding: 4px 10px;
            border-radius: var(--radius-1);
            box-shadow: inset 0 0 0 1px var(--on-stage-muted);
        }

        /* The live dot blinks, like the design system's live badge. */
        .status-pill::before {
            content: "";
            width: 8px;
            height: 8px;
            background: var(--success);
            animation: tv-blink var(--dur-idle) var(--ease-step) infinite;
        }

        @keyframes tv-blink {
            0%, 70% { opacity: 1; }
            71%, 100% { opacity: 0; }
        }

        /* Style for your new Fullscreen button to match the theme */
        #fullscreen-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: var(--control-height);
            padding: 0 var(--space-2);
            background: transparent;
            color: var(--cream);
            border: var(--border-pixel) solid var(--on-stage-muted);
            border-radius: var(--radius-2);
            font: 500 13px/16px var(--font-mono);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform var(--dur-instant) var(--ease-step), box-shadow var(--dur-instant) var(--ease-step);
        }
        #fullscreen-btn:hover {
            border-color: var(--cream);
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 0 var(--cherry);
        }
        #fullscreen-btn:focus-visible {
            outline: 2px solid var(--cherry);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .status-pill::before { animation: none; }
            #fullscreen-btn { transition: none; }
            #fullscreen-btn:hover { transform: none; }
        }
        </style>
    </head>
    <body>
        <div class="tv-container">
            <div class="app-grid">
                {{ range .Device.Apps }}
                {{ if and .Enabled (not .EmptyLastRender) }}
                <div class="app-card"
                     style="background: none;
                            border: none;
                            padding: 10px">
                    <img src="/devices/{{ $.Device.ID }}/installations/{{ .Iname }}/preview"
                         style="width: 100%;
                                aspect-ratio: {{ panelAspect $.Device.Type }};
                                image-rendering: pixelated;
                                display: block">
                </div>
                {{ end }}
                {{ end }}
            </div>
            <div class="device-header">
                <div>
                    {{ .Device.Name }} <span class="status-pill">Live Monitor</span>
                </div>
                <button id="fullscreen-btn"
                        type="button">
                    <i class="fa-solid fa-expand"></i> Fullscreen
                </button>
            </div>
        </div>
    </body>
</html>
{{ end }}
